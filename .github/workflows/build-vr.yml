name: Build MoonlightVR

# Build the feature branch on each reviewed code update; manual dispatch remains available.
on:
  push:
    branches:
      - main
      - feature/spatial-window-camera
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Restore large native libraries
        run: bash scripts/sync-native-libs.sh

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Read version from gradle
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[0-9.]+' app/build.gradle)
          BUILD_DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          BUILD_LABEL="${VERSION_NAME}"
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "BUILD_LABEL=$BUILD_LABEL" >> $GITHUB_OUTPUT

      - name: Prepare signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::error::缺少稳定签名密钥。请在 GitHub Actions Secrets 中配置 ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS 和 ANDROID_KEY_PASSWORD。"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/moonlightvr-ci.keystore"
          keytool -list -v -keystore "$RUNNER_TEMP/moonlightvr-ci.keystore" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep -m 1 "SHA256:"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          GRADLE_OPTS=""
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          if [[ "$BRANCH_NAME" == "main" || "$BRANCH_NAME" == "refs/heads/main" || "$BRANCH_NAME" == main ]]; then
            GRADLE_OPTS="-PincludeX64"
          fi

          if [[ -n "$ANDROID_KEYSTORE_BASE64" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_ALIAS" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            GRADLE_OPTS="$GRADLE_OPTS -PMOONLIGHTVR_STORE_FILE=$RUNNER_TEMP/moonlightvr-ci.keystore"
            GRADLE_OPTS="$GRADLE_OPTS -PMOONLIGHTVR_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            GRADLE_OPTS="$GRADLE_OPTS -PMOONLIGHTVR_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            GRADLE_OPTS="$GRADLE_OPTS -PMOONLIGHTVR_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          fi

          ./gradlew :app:assembleVrModeRelease $GRADLE_OPTS --no-daemon

      - name: Rename APK with metadata
        run: |
          BUILD_TYPE="release"
          BUILD_LABEL="${{ steps.version.outputs.BUILD_LABEL }}"
          SHA_SHORT=$(echo ${{ github.sha }} | cut -c1-8)
          APK_PATH="app/build/outputs/apk/vrMode/${BUILD_TYPE,,}/app-vrMode-${BUILD_TYPE,,}.apk"
          
          if [ -f "$APK_PATH" ]; then
            NEW_NAME="MoonlightVR ${BUILD_LABEL}.apk"
            cp "$APK_PATH" "$NEW_NAME"
            echo "APK_NAME=$NEW_NAME" >> $GITHUB_ENV
            echo "APK exists at: $APK_PATH"
          else
            echo "Error: APK not found at $APK_PATH"
            exit 1
          fi
          echo "BUILD_LABEL=${BUILD_LABEL}" >> $GITHUB_ENV

      - name: Publish APK as a direct GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Older queued builds must not overwrite the APK produced from a
          # newer branch commit. Only the current branch head may publish.
          LATEST_BRANCH_SHA="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"
          if [[ "$LATEST_BRANCH_SHA" != "$GITHUB_SHA" ]]; then
            echo "Skipping release upload: branch head is $LATEST_BRANCH_SHA, build commit is $GITHUB_SHA"
            exit 0
          fi
          RELEASE_TAG="vrmode-${BUILD_LABEL}"
          # Remove an unpushed local tag left by an earlier failed release attempt.
          git tag -d "$RELEASE_TAG" 2>/dev/null || true
          # GITHUB_TOKEN cannot create a release tag at a commit whose workflow
          # files differ from the default branch. Anchor the release tag to main;
          # the release notes identify the exact feature-branch source commit.
          RELEASE_NOTES="Signed Android release APK. App version: ${BUILD_LABEL}. APK source branch: ${GITHUB_REF_NAME}. APK source commit: ${GITHUB_SHA}. Download the APK directly."
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "main" \
              --title "MoonlightVR ${BUILD_LABEL}" \
              --notes "$RELEASE_NOTES" \
              --prerelease
          fi
          # Reuse the versioned release when it already exists, replacing only
          # the APK asset so reruns cannot fail on an existing release tag.
          gh release upload "$RELEASE_TAG" "$APK_NAME" --clobber
          gh release edit "$RELEASE_TAG" --title "MoonlightVR ${BUILD_LABEL}" --notes "$RELEASE_NOTES" --prerelease

      - name: Summary
        run: |
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          BRANCH_NAME="${BRANCH_NAME:-manual}"
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | $BRANCH_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| Flavor | vrMode |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Type | release |" >> $GITHUB_STEP_SUMMARY
          echo "| App Version | ${{ steps.version.outputs.VERSION_NAME }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Date (Asia/Shanghai) | ${{ steps.version.outputs.BUILD_DATE }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${BUILD_LABEL:-unknown} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| APK | ${{ env.APK_NAME }} |" >> $GITHUB_STEP_SUMMARY
